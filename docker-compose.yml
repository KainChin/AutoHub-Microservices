services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: car_dealership_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-service:
    build:
      context: ./services/customer-service
    container_name: customer_service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DB_HOST=sqlserver
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd!
      - DB_NAME=Car_Dealership
      - DB_PORT=1433
    depends_on:
      - sqlserver
    networks:
      - microservices_net

  sales-service:
    build:
      context: ./services/sales-service
    container_name: sales_service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - DB_HOST=sqlserver
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd!
      - DB_NAME=Car_Dealership
      - DB_PORT=1433
    depends_on:
      - sqlserver
    networks:
      - microservices_net

  garage-service:
    build:
      context: ./services/garage-service
    container_name: garage_service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - DB_HOST=sqlserver
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd!
      - DB_NAME=Car_Dealership
      - DB_PORT=1433
    depends_on:
      - sqlserver
    networks:
      - microservices_net

  parts-service:
    build:
      context: ./services/parts-service
    container_name: parts_service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - DB_HOST=sqlserver
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd!
      - DB_NAME=Car_Dealership
      - DB_PORT=1433
    depends_on:
      - sqlserver
    networks:
      - microservices_net

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api_gateway
    ports:
      - "5500:5000"
    environment:
      - PORT=5000
      - CUSTOMER_SERVICE_URL=http://customer-service:5001
      - SALES_SERVICE_URL=http://sales-service:5002
      - GARAGE_SERVICE_URL=http://garage-service:5003
      - PARTS_SERVICE_URL=http://parts-service:5004
    depends_on:
      - customer-service
      - sales-service
      - garage-service
      - parts-service
    networks:
      - microservices_net

  web-frontend:
    build:
      context: ./frontend
    container_name: car_dealership_web
    ports:
      - "8088:80"
    depends_on:
      - api-gateway
    networks:
      - microservices_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: autohub_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - microservices_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: autohub_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: AutoHub-Kafka-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - microservices_net

networks:
  microservices_net:
    driver: bridge

volumes:
  mssql_data:
